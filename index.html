<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background: linear-gradient(to bottom, #fe8cad, #fcfcfc);
      overflow: hidden;
    }

    .slider {
      display: flex;
      width: 100vw;
      height: 100vh;
      transition: transform 0.4s ease;
    }

    .page {
      min-width: 100vw;
      height: 100vh;
      padding: 24px;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .page img {
      max-width: 90%;
      max-height: 50vh;
      margin-bottom: 16px;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="slider" id="slider">

    <div class="page">
      <img src="./assets/f1.png">
      <p>Texto da primeira página 💖</p>
    </div>

    <div class="page">
      <img src="./assets/f2.png">
      <p>Verso da primeira 🥹</p>
    </div>

    <div class="page">
      <img src="./assets/f3.png">
      <p>Outra mensagem ❤️</p>
    </div>

    <div class="page">
      <img src="./assets/f4.png">
      <p>Verso final ✨</p>
    </div>

  </div>

  <div class="hint">Deslize para o lado 👉</div>

  <script>
    const slider = document.getElementById('slider');
    let index = 0;

    let startX = 0;

    document.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });

    document.addEventListener('touchend', e => {
      const endX = e.changedTouches[0].clientX;
      if (endX < startX - 50) index++;
      if (endX > startX + 50) index--;

      if (index < 0) index = 0;
      if (index > slider.children.length - 1)
        index = slider.children.length - 1;

      slider.style.transform = `translateX(-${index * 100}vw)`;
    });
  </script>

</body>
</html>
